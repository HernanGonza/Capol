<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plataforma CapOL</title>
    <meta name="description" content="Plataforma de cursos online - Escuela CapOL" />
    <meta name="author" content="CapOL" />

    <!-- Google exige un favicon explícito de al menos 48x48 (múltiplo de 48)
         para mostrarlo en los resultados de búsqueda — el favicon.ico viejo
         era de 16x16 y no calificaba, además de no estar declarado acá. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- WhatsApp es bastante más estricto que el debugger de Facebook con el
         tamaño/velocidad de descarga del og:image — el logo.png original
         pesaba 728KB (1024x1024 con alpha) y WhatsApp no lo mostraba. Esta
         versión (JPEG, fondo blanco, 800x800) pesa ~53KB. -->
    <meta property="og:title" content="Plataforma CapOL" />
    <meta property="og:description" content="Plataforma de cursos online - Escuela CapOL" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.capolescuela.com/" />
    <meta property="og:image" content="https://www.capolescuela.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://www.capolescuela.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="Logo de CapOL Escuela Virtual" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://www.capolescuela.com/og-image.jpg" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
